name: Build Valhalla Routing Tiles for Yemen

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'إنشاء Release برابط تحميل مباشر دائم'
        required: false
        default: 'true'
        type: boolean
  push:
    paths:
      - '.github/workflows/build_valhalla_tiles.yml'

permissions:
  contents: write

jobs:
  build-valhalla-tiles:
    name: Build Yemen Valhalla Tiles
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      # الخطوة 1: استدعاء كود المستودع
      - name: Checkout Repository
        uses: actions/checkout@v4

      # الخطوة 2: إنشاء مجلد العمل وتجهيز الصلاحيات
      - name: Step 1 - Setup Working Directory
        run: |
          mkdir -p custom_files
          chmod 777 custom_files

      # الخطوة 3: تحميل أحدث ملف خريطة لليمن من Geofabrik بصيغة OSM PBF
      - name: Step 2 - Download Yemen OSM PBF
        run: |
          echo "=== [1/4] جاري تحميل خريطة اليمن من Geofabrik ==="
          curl -fSL --retry 3 -o custom_files/yemen-latest.osm.pbf https://download.geofabrik.de/asia/yemen-latest.osm.pbf
          echo "حجم ملف خريطة اليمن المحمل:"
          ls -lh custom_files/yemen-latest.osm.pbf

      # الخطوة 4: تشغيل حاوية Docker الرسمية لـ Valhalla لبناء البلاطات والخروج فور الانتهاء (serve_tiles=False)
      - name: Step 3 - Build Valhalla Tiles via Docker
        run: |
          echo "=== [2/4] جاري بناء بلاطات Valhalla عبر Docker ==="
          docker run --rm \
            -e build_tar=True \
            -e force_rebuild=True \
            -e serve_tiles=False \
            -e build_elevation=False \
            -v "${{ github.workspace }}/custom_files:/custom_files" \
            ghcr.io/gis-ops/docker-valhalla/valhalla:latest
          echo "اكتمل بناء التايلز بنجاح!"

      # الخطوة 5: التحقق من ملف التايلز وضغطه في ملف ZIP نهائي
      - name: Step 4 - Verify and Compress to ZIP
        run: |
          echo "=== [3/4] جاري تجهيز وضغط ملف التايلز ==="
          sudo chmod -R 777 custom_files
          cd custom_files
          
          # استعراض الملفات الناتجة
          ls -la
          
          if [ -f "valhalla_tiles.tar" ]; then
            echo "تم العثور على valhalla_tiles.tar بنجاح."
            zip -9 yemen_valhalla_tiles.zip valhalla_tiles.tar valhalla.json
          elif [ -d "valhalla_tiles" ]; then
            echo "تم العثور على مجلد valhalla_tiles. جاري تحويله إلى tar ثم zip..."
            tar -cf valhalla_tiles.tar valhalla_tiles/
            zip -9 yemen_valhalla_tiles.zip valhalla_tiles.tar valhalla.json
          else
            echo "البحث عن أي أرشيف تايلز ناتج..."
            zip -r -9 yemen_valhalla_tiles.zip . -i "*.tar" -i "*.json"
          fi

          echo "حجم ملف yemen_valhalla_tiles.zip النهائي:"
          ls -lh yemen_valhalla_tiles.zip

      # الخطوة 6: رفع ملف ZIP كـ Artifact في تبويب Actions
      - name: Step 5 - Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: yemen-valhalla-maps
          path: custom_files/yemen_valhalla_tiles.zip
          retention-days: 90

      # الخطوة 7: إنشاء GitHub Release برابط تحميل مباشر
      - name: Step 6 - Create GitHub Release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.create_release == 'true' || github.event_name == 'push' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: yemen-valhalla-${{ github.run_number }}
          name: Yemen Valhalla Tiles Release v${{ github.run_number }}
          body: |
            ### 🇾🇪 حزمة بلاطات Valhalla الكاملة لخرائط اليمن (Yemen Routing Tiles)
            - **المصدر:** خريطة اليمن الرسمية من OpenStreetMap / Geofabrik.
            - **النوع:** بلاطات ملاحة رسمية حقيقية جاهزة للاستخدام بدون إنترنت.
            - **الملف المرفق:** `yemen_valhalla_tiles.zip` (يحتوي على `valhalla_tiles.tar` و `valhalla.json`).
          files: custom_files/yemen_valhalla_tiles.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
